name: Atualizar dados do painel

# Disparado pelo Power Automate (ação "Criar um evento de expedição de
# repositório", tipo de evento "atualizar-eventos") — recebe os dados mais
# recentes da planilha (via getEventos.ts) e grava em atendimento/dados.json,
# que o painel já lê sozinho a cada carregamento de página.
on:
  repository_dispatch:
    types: [atualizar-eventos]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gravar atendimento/dados.json
        run: |
          echo '${{ toJson(github.event.client_payload.dados) }}' > atendimento/dados.json

      - name: Commit e push (só se algo mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add atendimento/dados.json
          git diff --staged --quiet || git commit -m "Atualização automática dos eventos"
          git push
